server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: contingent-workforce-tracker
  datasource:
    url: jdbc:h2:file:./data/contingentdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: never


app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:3000}

# SpringDoc OpenAPI Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    com.contingentworkforce: DEBUG
    org.springframework.security: INFO

validation:
  timesheet:
    rules:
      standard-daily-hours: 8
      standard-weekly-hours: 40
      weekend-review-hours: 8
      high-daily-hours: 12
      critical-daily-hours: 16
      max-daily-hours: 24
      weekly-review-hours: 48
      weekly-high-risk-hours: 60